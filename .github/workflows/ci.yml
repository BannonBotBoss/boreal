# Boreal CI: the same two checks every agent runs before handing work over (RULES.md): unit tests and the type check.
# Based on GitHub's starter "Node.js" workflow (actions/setup-node). No lockfile in the repo, so npm install with the pinned versions.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit
  slow:
    # Issue #198: the long simulation tests (tests/slow/) run here in parallel, so the main test job stays short.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Chrome for the autoplay visit
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update -y
            sudo apt-get install -y /tmp/chrome.deb
          fi
          npx playwright install ffmpeg
      - run: npm run test:slow
