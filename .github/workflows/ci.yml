# Boreal CI: the same two checks every agent runs before handing work over (RULES.md): unit tests and the type check.
# Based on GitHub's starter "Node.js" workflow (actions/setup-node). No lockfile in the repo, so npm install with the pinned versions.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit
