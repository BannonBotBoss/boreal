[package]
name = "boreal-sim"
version = "0.1.0"
edition = "2021"
description = "Boreal planet budgets (solar, hydrosphere, atmosphere, surface) compiled to WebAssembly. Issue #43."
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
