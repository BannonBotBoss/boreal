<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>loading</title>
<style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#87a}</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { loadAnimalBuffer } from '/src/render/animalModels.ts';
import { spawnSkin } from '/src/render/meshySkin.ts';

const jobs = [
  ['Gray Wolf', 'gray-wolf.glb', {}],
  ['Snowshoe Hare', 'snowshoe-hare.glb', {}],
  ['White-tailed Deer', 'white-tailed-deer.glb', {}],
  ['American Black Bear', 'american-black-bear.glb', {}],
  ['Moose', 'moose.glb', {}],
  ['Red Fox', 'red-fox.glb', {}],
  ['Bald Eagle', 'bald-eagle.glb', { as: 'Hawks, Kites and Eagles' }],
  ['Elk', 'elk.glb', {}],
];

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(1280, 720);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc5d4c0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445533, 1.1));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.4);
sun.position.set(-4, 8, 6);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x6d7a52, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const lives = [];
let x = -8;
for (const [name, file, entry] of jobs) {
  const buf = await fetch(`/models/animals/${file}`).then(r => r.arrayBuffer());
  const loaded = await loadAnimalBuffer(buf, name, entry);
  const live = spawnSkin(loaded.skin);
  const span = Math.max(loaded.skin.depth, loaded.skin.height);
  live.root.position.set(x, 0, 0);
  scene.add(live.root);
  lives.push(live);
  x += Math.max(1.6, span * 0.85);
}
const mid = (lives[0].root.position.x + lives[lives.length - 1].root.position.x) / 2;
const camera = new THREE.PerspectiveCamera(38, 1280 / 720, 0.05, 120);
camera.position.set(mid, 2.4, 22);
camera.lookAt(mid, 0.8, 0);

let phase = 0;
window.__pose = (next) => { phase = next; };
function frame() {
  if (!window.__hold) phase += 0.012;
  for (const live of lives) live.pose('run', phase, 3.2);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
document.title = 'ready';
</script>
</body>
</html>
